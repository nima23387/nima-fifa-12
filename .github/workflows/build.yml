
name: Build Nima Football 2026 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ant wget unzip

      - name: Install Android SDK
        run: |
          mkdir -p "$ANDROID_HOME"
          cd /tmp

          wget -q https://dl.google.com/android/repository/tools_r25.2.5-linux.zip
          unzip -q tools_r25.2.5-linux.zip -d "$ANDROID_HOME"

          mkdir -p "$ANDROID_HOME/platforms/android-10"

          wget -q https://dl.google.com/android/repository/android-2.3.3_r02.zip
          unzip -q android-2.3.3_r02.zip -d /tmp/platform

          PLATFORM=$(find /tmp/platform -name android.jar -printf '%h\n' | head -n 1)
          test -n "$PLATFORM"
          cp -a "$PLATFORM/." "$ANDROID_HOME/platforms/android-10/"

          mkdir -p "$ANDROID_HOME/build-tools/23.0.3"

          wget -q https://dl.google.com/android/repository/build-tools_r23.0.3-linux.zip -O /tmp/bt.zip
          unzip -q /tmp/bt.zip -d /tmp/bt

          AAPT=$(find /tmp/bt -type f -name aapt | head -n 1)
          test -n "$AAPT"
          cp -a "$(dirname "$AAPT")/." "$ANDROID_HOME/build-tools/23.0.3/"
          chmod -R a+rX,u+w "$ANDROID_HOME/build-tools/23.0.3"

          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate Ant build.xml
        run: |
          "$ANDROID_HOME/tools/android" update project \
            --path "$GITHUB_WORKSPACE" \
            --target android-10

          test -f build.xml
          echo "build.xml successfully generated"

      - name: Build APK
        run: |
          ant -f "$GITHUB_WORKSPACE/build.xml" clean
          ant -f "$GITHUB_WORKSPACE/build.xml" debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nima-Football-2026-APK
          path: bin/*-debug.apk
          if-no-files-found: error
