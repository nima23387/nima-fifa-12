
name: Build Nima Football 2026 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ant wget unzip

      - name: Install legacy Android SDK
        run: |
          mkdir -p "$ANDROID_HOME"
          cd /tmp

          wget -q https://dl.google.com/android/repository/tools_r25.2.5-linux.zip
          unzip -q tools_r25.2.5-linux.zip -d "$ANDROID_HOME"

          mkdir -p "$ANDROID_HOME/platforms/android-10"

          wget -q https://dl.google.com/android/repository/android-2.3.3_r02.zip
          unzip -q android-2.3.3_r02.zip -d /tmp/android-platform

          PLATFORM=$(find /tmp/android-platform -type d -name android-10 | head -n 1)

          if [ -z "$PLATFORM" ]; then
            PLATFORM=$(find /tmp/android-platform -type f -name android.jar -printf '%h\n' | head -n 1)
          fi

          test -n "$PLATFORM"
          cp -a "$PLATFORM/." "$ANDROID_HOME/platforms/android-10/"

          mkdir -p "$ANDROID_HOME/build-tools/23.0.3"

          wget -q https://dl.google.com/android/repository/build-tools_r23.0.3-linux.zip -O /tmp/build-tools.zip
          unzip -q /tmp/build-tools.zip -d /tmp/build-tools

          AAPT=$(find /tmp/build-tools -type f -name aapt | head -n 1)
          test -n "$AAPT"

          cp -a "$(dirname "$AAPT")/." "$ANDROID_HOME/build-tools/23.0.3/"
          chmod -R a+rX,u+w "$ANDROID_HOME/build-tools/23.0.3"

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "$ANDROID_HOME/tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Generate Ant project files
        run: |
          "$ANDROID_HOME/tools/android" update project --path . --target android-10

      - name: Build debug APK
        run: |
          ant clean
          ant debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nima-Football-2026-APK
          path: bin/*-debug.apk
          if-no-files-found: error
